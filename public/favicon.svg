<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#1e2029"/>
  <!-- Candle 1 (bearish/muted) -->
  <line x1="8" y1="9" x2="8" y2="23" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="6.5" y="12" width="3" height="7" rx="1" fill="#f87171"/>
  <!-- Candle 2 (bullish/accent green) -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="14.5" y="9" width="3" height="11" rx="1" fill="#4ade80"/>
  <!-- Candle 3 (accent blue) -->
  <line x1="24" y1="8" x2="24" y2="22" stroke="#4fa5ff" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="22.5" y="11" width="3" height="8" rx="1" fill="#4fa5ff"/>
</svg>
